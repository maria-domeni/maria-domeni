<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Three findings: Audio sold below cost at minus 0.7 percent gross margin; 81.3 percent churn for customers under 5 active days in month one; 71,172 dollars in excess discount.">
  <title>Findings that changed a decision</title>
  <defs><clipPath id="c"><rect width="1200" height="230" rx="14"/></clipPath></defs>

  <g clip-path="url(#c)">
    <rect width="1200" height="230" fill="#070C17"/>

    <text x="56" y="48" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="13" letter-spacing="3.4" fill="#35D6E7">FINDINGS THAT CHANGED A DECISION</text>

    <path d="M420 78 V198 M820 78 V198" stroke="#8CACF0" stroke-opacity=".12" stroke-width="1"/>

    <!-- 1 · selling below cost -->
    <text x="56" y="126" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="42" font-weight="700" fill="#DE6E78">−0.7%</text>
    <text x="56" y="152" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="11.5" letter-spacing="2.4" fill="#68768F">GROSS MARGIN ON AUDIO</text>
    <text x="56" y="180" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="14" fill="#A6B3CB">Sold below cost after markdown,</text>
    <text x="56" y="200" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="14" fill="#A6B3CB">on 9.5% of net revenue.</text>

    <!-- 2 · churn -->
    <text x="456" y="126" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="42" font-weight="700" fill="#D9A44F">81.3%</text>
    <text x="456" y="152" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="11.5" letter-spacing="2.4" fill="#68768F">CHURN, UNDER 5 ACTIVE DAYS</text>
    <text x="456" y="180" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="14" fill="#A6B3CB">Against 42.3% for customers</text>
    <text x="456" y="200" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="14" fill="#A6B3CB">who reach 15+ days in month 1.</text>

    <!-- 3 · excess discount -->
    <text x="856" y="126" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="42" font-weight="700" fill="#35D6E7">$71,172</text>
    <text x="856" y="152" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="11.5" letter-spacing="2.4" fill="#68768F">EXCESS DISCOUNT FOUND</text>
    <text x="856" y="180" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="14" fill="#A6B3CB">6.8% of total gross margin,</text>
    <text x="856" y="200" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="14" fill="#A6B3CB">across three subcategories.</text>
  </g>

  <rect x=".5" y=".5" width="1199" height="229" rx="14" fill="none" stroke="#8CACF0" stroke-opacity=".14"/>
</svg>
