<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 232" width="1200" height="232" role="img" aria-label="psql session: SELECT who, what, why FROM me; returns one row — Maria Domeni, Data Analyst, turning data into strategic decisions.">
  <title>Maria Domeni — Data Analyst</title>

  <defs>
    <clipPath id="card"><rect width="1200" height="232" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace">
    <rect width="1200" height="232" fill="#05080F"/>

    <!-- window chrome -->
    <rect width="1200" height="38" fill="#0A1122"/>
    <line x1="0" y1="38" x2="1200" y2="38" stroke="#8CACF0" stroke-opacity=".14"/>
    <circle cx="26" cy="19" r="5" fill="#DE6E78"/>
    <circle cx="46" cy="19" r="5" fill="#D9A44F"/>
    <circle cx="66" cy="19" r="5" fill="#35D6E7"/>
    <text x="92" y="24" font-size="12.5" fill="#5A6880">psql — analytics@maria-domeni</text>
    <text x="1176" y="24" text-anchor="end" font-size="12.5" fill="#5A6880">0.042s</text>

    <!-- the query -->
    <text x="40" y="76" font-size="15.5">
      <tspan fill="#35D6E7">analytics=#</tspan><tspan fill="#E7ECF6" xml:space="preserve">  </tspan><tspan fill="#5D8CFF">SELECT</tspan><tspan fill="#C5CFE2"> who, what, why </tspan><tspan fill="#5D8CFF">FROM</tspan><tspan fill="#C5CFE2"> me;</tspan>
    </text>

    <!-- result header -->
    <text x="40"  y="116" font-size="14" fill="#5A6880">who</text>
    <text x="268" y="116" font-size="14" fill="#5A6880">what</text>
    <text x="476" y="116" font-size="14" fill="#5A6880">why</text>

    <line x1="40" y1="130" x2="1000" y2="130" stroke="#8CACF0" stroke-opacity=".18"/>
    <line x1="250" y1="100" x2="250" y2="168" stroke="#8CACF0" stroke-opacity=".18"/>
    <line x1="458" y1="100" x2="458" y2="168" stroke="#8CACF0" stroke-opacity=".18"/>

    <!-- the one row -->
    <text x="40"  y="156" font-size="16.5" font-weight="700" fill="#E7ECF6">Maria Domeni</text>
    <text x="268" y="156" font-size="16.5" fill="#35D6E7">Data Analyst</text>
    <text x="476" y="156" font-size="16.5" fill="#A6B3CB">turning data into strategic decisions</text>

    <text x="40" y="192" font-size="13.5" fill="#5A6880">(1 row)</text>

    <!-- cursor waiting on the next prompt -->
    <text x="40" y="216" font-size="15.5" fill="#35D6E7">analytics=#</text>
    <rect x="146" y="204" width="9" height="17" fill="#35D6E7">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite" keyTimes="0;.5;.5;1"/>
    </rect>
  </g>

  <rect x=".5" y=".5" width="1199" height="231" rx="12" fill="none" stroke="#8CACF0" stroke-opacity=".16"/>
</svg>
