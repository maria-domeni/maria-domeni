<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 392" width="1200" height="392" role="img" aria-label="Methods and strengths: dimensional modeling, ETL and data quality, cohort and retention analysis, dashboard design, analytical thinking, data storytelling, problem solving, attention to detail.">
  <title>Methods &amp; strengths</title>

  <defs>
    <clipPath id="cp"><rect width="1200" height="392" rx="16"/></clipPath>
    <g id="i-model"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="4" r="2"/><circle cx="20" cy="4" r="2"/><circle cx="4" cy="20" r="2"/><circle cx="20" cy="20" r="2"/><path d="M9.9 9.9 5.4 5.4M14.1 9.9l4.5-4.5M9.9 14.1l-4.5 4.5M14.1 14.1l4.5 4.5"/></g>
    <g id="i-etl"><path d="M3 4h18l-7 8v8l-4-2v-6z"/></g>
    <g id="i-cohort"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9h18M3 14.5h18M9 4v16M15 4v16"/></g>
    <g id="i-dash"><rect x="3" y="3" width="8" height="8" rx="1.4"/><rect x="13" y="3" width="8" height="5" rx="1.4"/><rect x="3" y="13" width="8" height="8" rx="1.4"/><rect x="13" y="10" width="8" height="11" rx="1.4"/></g>
    <g id="i-brain"><path d="M9.5 3A3.5 3.5 0 0 0 6 6.5 3 3 0 0 0 4 9.3a3 3 0 0 0 1.2 2.4A3.2 3.2 0 0 0 4.6 14a3.2 3.2 0 0 0 2 3 3 3 0 0 0 3 4c1.4 0 2.4-.8 2.4-2V5.2A2.2 2.2 0 0 0 9.5 3z"/><path d="M14.5 3A3.5 3.5 0 0 1 18 6.5a3 3 0 0 1 2 2.8 3 3 0 0 1-1.2 2.4 3.2 3.2 0 0 1 .6 2.3 3.2 3.2 0 0 1-2 3 3 3 0 0 1-3 4c-1.4 0-2.4-.8-2.4-2V5.2A2.2 2.2 0 0 1 14.5 3z"/></g>
    <g id="i-story"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M7 12.5 10 9l2.5 2.5L17 7"/></g>
    <g id="i-bulb"><path d="M9 18h6M10 21.5h4"/><path d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.5.4.8 1 .8 1.6V18h6v-2.1c0-.6.3-1.2.8-1.6A6.5 6.5 0 0 0 12 2.5z"/></g>
    <g id="i-eye"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></g>
  </defs>

  <g clip-path="url(#cp)">
    <rect width="1200" height="392" fill="#070C17"/>

    <text x="40" y="48" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,monospace"
          font-size="13" letter-spacing="4.5" fill="#35D6E7">METHODS &amp; STRENGTHS</text>

    <!-- accent bars -->
    <g fill="#35D6E7" fill-opacity=".5">
      <rect x="40"  y="80"  width="2" height="52" rx="1"/><rect x="620" y="80"  width="2" height="52" rx="1"/>
      <rect x="40"  y="152" width="2" height="52" rx="1"/><rect x="620" y="152" width="2" height="52" rx="1"/>
      <rect x="40"  y="224" width="2" height="52" rx="1"/><rect x="620" y="224" width="2" height="52" rx="1"/>
      <rect x="40"  y="296" width="2" height="52" rx="1"/><rect x="620" y="296" width="2" height="52" rx="1"/>
    </g>

    <!-- glyphs -->
    <g fill="none" stroke="#7C8AA3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(62,84)"><use href="#i-model"/></g>
      <g transform="translate(642,84)"><use href="#i-brain"/></g>
      <g transform="translate(62,156)"><use href="#i-etl"/></g>
      <g transform="translate(642,156)"><use href="#i-story"/></g>
      <g transform="translate(62,228)"><use href="#i-cohort"/></g>
      <g transform="translate(642,228)"><use href="#i-bulb"/></g>
      <g transform="translate(62,300)"><use href="#i-dash"/></g>
      <g transform="translate(642,300)"><use href="#i-eye"/></g>
    </g>

    <!-- titles -->
    <g font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="600" fill="#E7ECF6">
      <text x="100" y="99">Dimensional modeling</text>
      <text x="680" y="99">Analytical thinking</text>
      <text x="100" y="171">ETL &amp; data quality</text>
      <text x="680" y="171">Data storytelling</text>
      <text x="100" y="243">Cohort &amp; retention analysis</text>
      <text x="680" y="243">Problem solving</text>
      <text x="100" y="315">Dashboard design</text>
      <text x="680" y="315">Attention to detail</text>
    </g>

    <!-- notes -->
    <g font-family="'IBM Plex Mono','Cascadia Mono',Consolas,monospace" font-size="11.5" fill="#7C8AA3">
      <text x="100" y="121">star schemas, grain decisions, conformed dimensions</text>
      <text x="680" y="121">break the question down before touching the data</text>
      <text x="100" y="193">type fixing, closed vocabularies, integrity checks</text>
      <text x="680" y="193">the chart makes the point, the title says it out loud</text>
      <text x="100" y="265">monthly panels, retention curves, survival framing</text>
      <text x="680" y="265">find the constraint, not just the symptom</text>
      <text x="100" y="337">one question per page, ten-second readability</text>
      <text x="680" y="337">the wrong denominator is invisible and expensive</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="391" rx="16" fill="none" stroke="#8CACF0" stroke-opacity=".14"/>
</svg>
