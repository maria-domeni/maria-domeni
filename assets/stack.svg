<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Technical stack: SQL, Power BI, Python, Excel, pandas, scikit-learn, Matplotlib, DAX, Power Query, dimensional modeling, Git, Jira.">
  <title>Technical stack</title>

  <defs>
    <clipPath id="c"><rect width="1200" height="300" rx="14"/></clipPath>
    <!-- One line-art system, one stroke weight. A wall of mismatched vendor
         logos reads as a sticker collection, not as a skill set. -->
    <g id="g-sql"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></g>
    <g id="g-bi"><path d="M3 21h18"/><rect x="4" y="13" width="4" height="6"/><rect x="10" y="8" width="4" height="11"/><rect x="16" y="4" width="4" height="15"/></g>
    <g id="g-py"><path d="M12 3c-3.3 0-4 1.4-4 3v2h8v1H6c-1.8 0-3 1.5-3 4s1.2 4 3 4h2v-2.6c0-1.9 1.5-3.4 3.4-3.4h3.2c1.6 0 3-1.3 3-3V6c0-1.7-1.5-3-4-3z"/><path d="M12 21c3.3 0 4-1.4 4-3v-2H8v-1h10c1.8 0 3-1.5 3-4s-1.2-4-3-4h-2v2.6c0 1.9-1.5 3.4-3.4 3.4H9.4C7.8 13 6.4 14.3 6.4 16v2c0 1.7 1.5 3 4 3z"/></g>
    <g id="g-xl"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9h18M9 9v11M3 14.5h18"/><path d="M12.4 11.6 16 17.4M16 11.6l-3.6 5.8"/></g>
    <g id="g-pd"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8v4M8 15v1M12 6v3M12 12v6M16 8v8M16 18.5v.5"/></g>
    <g id="g-ml"><path d="M3 19 9 12l4 4 8-9"/><circle cx="9" cy="12" r="1.6"/><circle cx="13" cy="16" r="1.6"/><circle cx="21" cy="7" r="1.6"/><path d="M3 21h18"/></g>
    <g id="g-story"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M7 12.5 10 9l2.5 2.5L17 7"/></g>
    <g id="g-code"><path d="M8.5 7 3 12l5.5 5M15.5 7 21 12l-5.5 5M13.5 4l-3 16"/></g>
    <g id="g-lay"><path d="M12 2.5 22 8l-10 5.5L2 8z"/><path d="m2 13 10 5.5L22 13"/></g>
    <g id="g-model"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="4" r="2"/><circle cx="20" cy="4" r="2"/><circle cx="4" cy="20" r="2"/><circle cx="20" cy="20" r="2"/><path d="M9.9 9.9 5.4 5.4M14.1 9.9l4.5-4.5M9.9 14.1l-4.5 4.5M14.1 14.1l4.5 4.5"/></g>
    <g id="g-git"><circle cx="6" cy="5" r="2.4"/><circle cx="6" cy="19" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M6 7.4v9.2M8.4 5h4.6a2.6 2.6 0 0 1 2.6 2.6v2"/></g>
    <g id="g-jira"><path d="M12 2 22 12 12 22 2 12z"/><path d="M12 8.2 15.8 12 12 15.8 8.2 12z"/></g>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1200" height="300" fill="#070C17"/>

    <text x="56" y="48" font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
          font-size="13" letter-spacing="3.4" fill="#35D6E7">TECHNICAL STACK</text>

    <g fill="none" stroke="#35D6E7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(56,84)  scale(1.25)"><use href="#g-sql"/></g>
      <g transform="translate(328,84) scale(1.25)"><use href="#g-bi"/></g>
      <g transform="translate(600,84) scale(1.25)"><use href="#g-py"/></g>
      <g transform="translate(872,84) scale(1.25)"><use href="#g-xl"/></g>

      <g transform="translate(56,152)  scale(1.25)"><use href="#g-pd"/></g>
      <g transform="translate(328,152) scale(1.25)"><use href="#g-ml"/></g>
      <g transform="translate(600,152) scale(1.25)"><use href="#g-story"/></g>
      <g transform="translate(872,152) scale(1.25)"><use href="#g-code"/></g>

      <g transform="translate(56,220)  scale(1.25)"><use href="#g-lay"/></g>
      <g transform="translate(328,220) scale(1.25)"><use href="#g-model"/></g>
      <g transform="translate(600,220) scale(1.25)"><use href="#g-git"/></g>
      <g transform="translate(872,220) scale(1.25)"><use href="#g-jira"/></g>
    </g>

    <g font-family="'IBM Plex Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace"
       font-size="15.5" fill="#C5CFE2">
      <text x="100" y="104">SQL</text>
      <text x="372" y="104">Power BI</text>
      <text x="644" y="104">Python</text>
      <text x="916" y="104">Excel</text>

      <text x="100" y="172">pandas</text>
      <text x="372" y="172">scikit-learn</text>
      <text x="644" y="172">Matplotlib</text>
      <text x="916" y="172">DAX</text>

      <text x="100" y="240">Power Query</text>
      <text x="372" y="240">Modeling</text>
      <text x="644" y="240">Git</text>
      <text x="916" y="240">Jira</text>
    </g>

    <g stroke="#8CACF0" stroke-opacity=".09" stroke-width="1">
      <path d="M56 128 H1144 M56 196 H1144"/>
    </g>
  </g>

  <rect x=".5" y=".5" width="1199" height="299" rx="14" fill="none" stroke="#8CACF0" stroke-opacity=".14"/>
</svg>
